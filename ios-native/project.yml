name: UphillAI
options:
  bundleIdPrefix: ai.uphill
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 2JR7MV87X6
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  UphillAI:
    type: application
    platform: iOS
    sources:
      - path: UphillAI
    info:
      path: UphillAI/Info.plist
      properties:
        CFBundleDisplayName: Uphill AI
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [PlusJakartaSans.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "Uphill AI syncs your scheduled training plan workouts and long runs to your calendar."
        NSCalendarsWriteOnlyAccessUsageDescription: "Uphill AI adds your scheduled workouts directly to your calendar."
        NSHealthShareUsageDescription: "Uphill AI reads your runs, hikes and strength workouts, plus resting heart rate, HRV and sleep, so it can mark sessions done, measure your weekly mileage and adjust training to how you're recovering."
        NSHealthUpdateUsageDescription: "Uphill AI does not write to Apple Health. It only reads your workouts to mark planned sessions done."
        GIDClientID: 451637841654-ncj3jhv24t9rq665noctori05faajiej.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.451637841654-ncj3jhv24t9rq665noctori05faajiej
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: UphillAI/UphillAI.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        APNS_ENVIRONMENT: development
        PRODUCT_BUNDLE_IDENTIFIER: uphill.ai.app
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          APNS_ENVIRONMENT: production
  UphillAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UphillAITests
    dependencies:
      - target: UphillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uphill.ai.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  UphillAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UphillAIUITests
    dependencies:
      - target: UphillAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uphill.ai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UphillAI
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  UphillAI:
    build:
      targets:
        UphillAI: all
        UphillAITests: [test]
    test:
      targets:
        - UphillAITests
  UphillAI-E2E:
    build:
      targets:
        UphillAI: all
        UphillAIUITests: [test]
    test:
      targets:
        - UphillAIUITests

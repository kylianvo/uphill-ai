name: ios-native

on:
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  push:
    branches: [main]
    paths:
      - "ios-native/**"

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The `xcode-27` image (macOS with Xcode 27) is the toolchain the app is built with;
    # macos-15 ships Xcode 16 and fails to compile the current sources.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # Simulator that exists on the Xcode 27.0 image; test.sh would otherwise pick the newest runtime.
      DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: ios-native/scripts/test.sh

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uphill_ai
      POSTGRES_USER: uphill
      POSTGRES_PASSWORD: uphill_secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uphill -d uphill_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: uphill-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # Deliberately no env_file here (unlike the other services in this file):
    # Docker Compose's env_file loading applies ${VAR}/$VAR interpolation to
    # the file's content, which silently corrupts any value containing a
    # literal `$` (confirmed in practice with NOTEBOOKLM_AUTH_JSON, an opaque
    # cookie-session JSON blob) unless every `$` is escaped as `$$` in the
    # source file -- which backend/.env can't require, since it's also read
    # directly (correctly, no interpolation) by config.py's load_dotenv() for
    # local non-Docker dev and by scripts/tooling. The backend/:/app volume
    # mount below already gives this container backend/.env on disk, and
    # config.py's own load_dotenv() call reads it directly via Python at
    # import time -- no Compose interpolation involved, no corruption risk.
    environment:
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./backend/qdrant_storage:/qdrant/storage

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two PLAINTEXT-protocol listeners, not the brief's one: containers on the
      # compose network (kafka-consumer) dial the broker as "kafka:9092", but a
      # host-run pytest (KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092, per the brief's
      # own test instructions) can't resolve "kafka" -- with only one advertised
      # listener, the client's initial bootstrap connection to 127.0.0.1:9092
      # succeeds, but the metadata response then hands back "kafka:9092" as the
      # broker address, which the host can't reach, and the client hangs forever
      # re-querying. EXTERNAL advertises "127.0.0.1:9092" (the host-mapped port)
      # so a host client's subsequent connections resolve correctly too. Using
      # "127.0.0.1" rather than "localhost" here is deliberate: the port below is
      # published ipv4-only (127.0.0.1:9092:9094), but on macOS/Docker Desktop
      # "localhost" resolves to ipv6 (::1) first, which that mapping doesn't
      # cover -- an advertised "localhost:9092" causes host clients to get
      # "Connection refused" against the ipv6 address instead of ever trying v4.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: uphill-ai-kafka-cluster-01
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-consumer:
    image: uphill-backend:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    command: python kafka_consumer_worker.py

  airflow-init:
    image: uphill-airflow:latest
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    # backend/.env (read-only, to generate airflow/.env from) and the
    # airflow/ dir itself (read-write, so render-env.sh's output lands back
    # on the host before airflow-webserver/airflow-scheduler start — they
    # depend on this container completing first).
    volumes:
      - ./backend:/opt/airflow/backend-src:ro
      - ./airflow:/opt/airflow/airflow-src
    entrypoint: /bin/bash
    command: >
      -c "bash /opt/airflow/airflow-src/render-env.sh /opt/airflow/backend-src/.env /opt/airflow/airflow-src/.env &&
      (PGPASSWORD=uphill_secret psql -h db -U uphill -d uphill_ai -tc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 ||
      PGPASSWORD=uphill_secret psql -h db -U uphill -d uphill_ai -c \"CREATE DATABASE airflow\") &&
      airflow db init &&
      (airflow users create --username admin --password \"${AIRFLOW_ADMIN_PASSWORD:-admin}\" --firstname admin --lastname admin --role Admin --email admin@uphill.ai || true)"

  airflow-webserver:
    image: uphill-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"
    # Narrow, Airflow-only secrets — NOT the full backend/.env (which also
    # carries JWT_SECRET, OAuth client secrets, etc. that this service never
    # reads). airflow/.env is generated automatically by airflow-init's
    # first command step (render-env.sh) before this service starts — see
    # airflow-init below. Safe to run `./airflow/render-env.sh` by hand too.
    env_file:
      - ./airflow/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONPATH: /opt/airflow/backend
      DUCKDB_PATH: /opt/airflow/warehouse/uphill_dw.duckdb
      DBT_PROJECT_DIR: /opt/airflow/warehouse
      DBT_PROFILES_DIR: /opt/airflow/warehouse
    volumes:
      - ./backend:/opt/airflow/backend:ro
      # backend/kb_seed is the one part of backend/ the DAG's save/embed steps
      # legitimately write to (export_seed()) -- overlay it read-write while
      # the rest of the backend code stays read-only.
      - ./backend/kb_seed:/opt/airflow/backend/kb_seed
      - ./airflow/dags:/opt/airflow/dags
      - ./warehouse:/opt/airflow/warehouse
    command: webserver

  airflow-scheduler:
    image: uphill-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Narrow, Airflow-only secrets — see airflow-webserver's comment above.
    env_file:
      - ./airflow/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONPATH: /opt/airflow/backend
      DUCKDB_PATH: /opt/airflow/warehouse/uphill_dw.duckdb
      DBT_PROJECT_DIR: /opt/airflow/warehouse
      DBT_PROFILES_DIR: /opt/airflow/warehouse
    volumes:
      - ./backend:/opt/airflow/backend:ro
      # backend/kb_seed is the one part of backend/ the DAG's save/embed steps
      # legitimately write to (export_seed()) -- overlay it read-write while
      # the rest of the backend code stays read-only.
      - ./backend/kb_seed:/opt/airflow/backend/kb_seed
      - ./airflow/dags:/opt/airflow/dags
      - ./warehouse:/opt/airflow/warehouse
    command: scheduler

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"

  metabase-driver-init:
    image: curlimages/curl:latest
    restart: "no"
    # curlimages/curl runs as a non-root user by default (curl_user); the
    # named metabase_plugins volume is created root-owned on first use, so
    # without this the download succeeds but the write to /plugins fails
    # with "curl: (23) client returned ERROR on write" (permission denied).
    user: "0:0"
    volumes:
      - metabase_plugins:/plugins
    entrypoint: /bin/sh
    command: >
      -c "JAR_URL=$$(curl -sSL https://api.github.com/repos/motherduckdb/metabase_duckdb_driver/releases/latest | grep browser_download_url | grep '.jar' | cut -d '\"' -f 4) &&
      echo \"Downloading $$JAR_URL\" &&
      curl -sSL -o /plugins/duckdb.metabase-driver.jar \"$$JAR_URL\" &&
      chmod -R a+rwX /plugins &&
      echo 'DuckDB driver downloaded successfully'"

  metabase:
    # The official metabase/metabase image is Alpine (musl libc) on BOTH
    # arm64 and amd64. The motherduck DuckDB driver's bundled native lib
    # statically links jemalloc, which crashes the JVM with SIGSEGV in
    # `malloc_init_hard` (and, before that, in aarch64 CPU-feature detection)
    # when loaded under musl -- this is a musl/jemalloc incompatibility, not
    # an architecture issue (confirmed by reproducing under both arm64 and
    # an amd64/Rosetta run of the same Alpine image; `libstdc++`/`gcompat`
    # packages don't fix it either). Metabase publishes no glibc-based image,
    # so we build one here: reuse the official image's /app (metabase.jar +
    # run_metabase.sh, both plain Java/shell, no Alpine-specific syntax) on
    # top of a Debian-based JRE, which uses glibc and doesn't hit this bug.
    build:
      context: ./metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_TYPE: postgres
      # Deliberately a separate database from the app's `uphill_ai` (both
      # live on the same Postgres server/user) -- Metabase's own tables
      # (core_user, report_card, etc.) don't collide with app table names,
      # but keeping them in their own database means Metabase's schema
      # migrations/version pin (see the `latest` vs pinned-version note
      # below) can never affect app data, and app-db backups/restores of
      # `uphill_ai` stay unaffected by Metabase's own state.
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: uphill
      MB_DB_PASS: ${POSTGRES_PASSWORD:-uphill_secret}
      MB_DB_HOST: db
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - metabase_plugins:/plugins
      - ./warehouse:/warehouse:ro
    depends_on:
      db:
        condition: service_healthy
      metabase-driver-init:
        condition: service_completed_successfully


  frontend:
    image: uphill-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # next static export bakes NEXT_PUBLIC_* at build time; the runtime
        # environment entry below has no effect on the exported bundle
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
volumes:
  pgdata:
    name: uphill-ai_pgdata
  prometheus_data:
  grafana_data:
  kafka_data:
  metabase_plugins:

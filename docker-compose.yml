services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uphill_ai
      POSTGRES_USER: uphill
      POSTGRES_PASSWORD: uphill_secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uphill -d uphill_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: uphill-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./backend/qdrant_storage:/qdrant/storage

  airflow-init:
    image: uphill-airflow:latest
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    entrypoint: /bin/bash
    command: >
      -c "PGPASSWORD=uphill_secret psql -h db -U uphill -d uphill_ai -tc \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 ||
      PGPASSWORD=uphill_secret psql -h db -U uphill -d uphill_ai -c \"CREATE DATABASE airflow\" &&
      airflow db init"

  airflow-webserver:
    image: uphill-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - ./backend/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONPATH: /opt/airflow/backend
    volumes:
      - ./backend:/opt/airflow/backend:ro
      - ./airflow/dags:/opt/airflow/dags
    command: webserver

  airflow-scheduler:
    image: uphill-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://uphill:uphill_secret@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://uphill:uphill_secret@db:5432/uphill_ai
      PYTHONPATH: /opt/airflow/backend
    volumes:
      - ./backend:/opt/airflow/backend:ro
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: uphill_ai
      MB_DB_PORT: 5432
      MB_DB_USER: uphill
      MB_DB_PASS: ${POSTGRES_PASSWORD:-uphill_secret}
      MB_DB_HOST: db
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      db:
        condition: service_healthy


  frontend:
    image: uphill-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # next static export bakes NEXT_PUBLIC_* at build time; the runtime
        # environment entry below has no effect on the exported bundle
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
volumes:
  pgdata:
    name: uphill-ai_pgdata
  prometheus_data:
  grafana_data:
